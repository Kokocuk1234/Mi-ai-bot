services:
  - type: web
    name: nova-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MY_ID
        sync: false
      - key: RENDER_URL
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
    disk:
      name: nova-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
